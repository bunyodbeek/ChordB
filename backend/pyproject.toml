[project]
name = "chordb-backend"
version = "0.1.0"
description = "ChordB HTTP API"
requires-python = ">=3.12"
dependencies = [
    "chordb-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "alembic>=1.14",
]

[tool.uv.sources]
chordb-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
