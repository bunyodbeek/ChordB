[project]
name = "chordb-backend"
version = "0.1.0"
description = "ChordB HTTP API"
requires-python = ">=3.12"
dependencies = [
    "chordb-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "alembic>=1.14",
    "librosa>=0.11",
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
    "python-multipart>=0.0.20",
    "yt-dlp[deno]>=2026.1",
    "yt-dlp-ejs>=0.8.0",
    "httpx>=0.28",
]

[tool.uv.sources]
chordb-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
