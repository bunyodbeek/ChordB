[project]
name = "chordb-bot"
version = "0.1.0"
description = "ChordB Telegram bot and scheduled notifications"
requires-python = ">=3.12"
dependencies = [
    "chordb-common",
    "aiogram>=3.15,<4",
    "apscheduler>=3.10,<4",
    "tzdata",
]

[tool.uv.sources]
chordb-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chordb_bot"]
