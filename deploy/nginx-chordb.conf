# /etc/nginx/sites-available/chordb  →  ln -s to sites-enabled, then: nginx -t && systemctl reload nginx
# TLS: certbot --nginx -d chordb.shredzville.com  (adds the 443 block / redirects)

server {
    listen 80;
    server_name chordb.shredzville.com;

    root /opt/chordb/webapp/dist;
    index index.html;

    # Chord-detection uploads: 50 MB (ANALYZE_MAX_UPLOAD_MB) plus multipart overhead.
    location = /api/analyze {
        client_max_body_size 51m;
        proxy_request_buffering off;  # stream to the backend, which enforces the exact limit
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets: cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: index.html must never be cached so new builds show up in Telegram.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
