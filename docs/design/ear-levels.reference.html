<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>ChordB — Quloq testi darajalari</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F4F5F2}
a{color:#1F3FCC}a:hover{color:#15309E}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F2; color: #15171A; font-family: 'Bricolage Grotesque', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 80px; box-sizing: border-box; padding: 0 16px; background: #FFFFFF; border-bottom: 1px solid #E3E5E0">
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-weight: 800; font-size: 26px; letter-spacing: -0.03em">Quloq testi</h1>
      <span style="font-size: 13px; color: #5B6068">Keyingi daraja faqat 10/10 bilan ochiladi</span>
    </div>
    <span role="img" aria-label="Mukammal seriya: 3" style="flex: none; height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 10px; background: #DDF0E7; color: #0B5A40; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px">10/10 ×3</span>
  </header>

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 16px; overflow-y: auto">
    <sc-for list="{{levels}}" as="l" hint-placeholder-count="8">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 12px; box-sizing: border-box; border-radius: 16px; background: {{l.bg}}; border: {{l.border}}; opacity: {{l.opacity}}">
        <span aria-hidden="true" style="width: 40px; height: 40px; flex: none; border-radius: 50%; background: {{l.numBg}}; color: {{l.numFg}}; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px">{{l.badge}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="display: flex; align-items: center; gap: 6px">
            <span style="font-weight: 700; font-size: 15px">{{l.title}}</span>
            <sc-if value="{{l.premium}}" hint-placeholder-val="{{ false }}">
              <span style="height: 20px; display: inline-flex; align-items: center; padding: 0 6px; border-radius: 6px; background: #15171A; color: #FFFFFF; font-size: 11px; font-weight: 600">Premium</span>
            </sc-if>
          </span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5B6068; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{l.pool}}</span>
        </span>
        <sc-if value="{{l.isCurrent}}" hint-placeholder-val="{{ false }}">
          <a href="G3-Quloq.dc.html" style="flex: none; height: 40px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 12px; background: #2F5BFF; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 14px">Boshlash</a>
        </sc-if>
        <sc-if value="{{l.showScore}}" hint-placeholder-val="{{ true }}">
          <span style="flex: none; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px; color: {{l.scoreFg}}">{{l.score}}</span>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"int","min":1,"max":8,"default":4},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = this.props.current ?? 4;
    const raw = [
      ['Major yoki minor?', 'C G D A E · Am Em Dm', '10/10'],
      ['Ochiq major', 'C G D A E', '10/10'],
      ['Ochiq minor', 'Am Em Dm', '10/10'],
      ['Aralash ochiq', 'major + minor', '9/10'],
      ['Birinchi barre', 'F Bm + ochiq', ''],
      ['Barre akkordlar', 'F#m B Bb C#m Gm', ''],
      ['7-akkordlar', 'G7 D7 E7 A7 B7', ''],
      ['Progressiyalar', '4 akkordli ketma-ketlik', '']
    ];
    return {
      levels: raw.map((r, i) => {
        const n = i + 1;
        const done = n < cur, isCurrent = n === cur, locked = n > cur;
        return {
          title: n + '. ' + r[0], pool: r[1], premium: n >= 5,
          badge: done ? '✓' : String(n),
          numBg: done ? '#12805C' : (isCurrent ? '#2F5BFF' : '#E6E8E3'),
          numFg: done || isCurrent ? '#FFFFFF' : '#8A8F96',
          bg: isCurrent ? '#F5F8FF' : '#FFFFFF',
          border: isCurrent ? '2px solid #2F5BFF' : '1px solid #DADCD6',
          opacity: locked ? 0.6 : 1,
          isCurrent,
          showScore: !isCurrent,
          score: done ? '10/10' : (locked ? 'Qulflangan' : ''),
          scoreFg: done ? '#0B5A40' : '#5B6068'
        };
      }).map((l, i) => (i + 1 === cur ? Object.assign(l, { pool: l.pool + ' · eng yaxshi 9/10' }) : l))
    };
  }
}
</script>
</body>
</html>
