<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>ChordB — Akkord almashtirish</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F4F5F2}
a{color:#1F3FCC}a:hover{color:#15309E}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F2; color: #15171A; font-family: 'Bricolage Grotesque', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 80px; box-sizing: border-box; padding: 0 16px; background: #FFFFFF; border-bottom: 1px solid #E3E5E0">
    <h1 style="margin: 0; font-weight: 800; font-size: 26px; letter-spacing: -0.02em">Akkord almashtirish</h1>
    <span role="timer" aria-label="Qolgan vaqt" style="height: 32px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 10px; background: #15171A; color: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px">0:42</span>
  </header>
  <div aria-hidden="true" style="flex: none; height: 4px; background: #E3E5E0"><div style="width: 70%; height: 4px; background: #2F5BFF"></div></div>

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 18px 16px">
    <div aria-label="Zanjir" style="display: flex; align-items: center; gap: 6px">
      <sc-for list="{{chain}}" as="c" hint-placeholder-count="4">
        <span style="min-width: 46px; height: 36px; padding: 0 8px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; display: inline-flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px">{{c.n}}</span>
        <sc-if value="{{c.arrow}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="color: #8A8F96">→</span></sc-if>
      </sc-for>
    </div>

    <button type="button" onClick="{{correct}}" aria-label="Demo: akkord toʻgʻri chalindi" style="width: 358px; flex: 1; min-height: 0; max-height: 430px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; border-radius: 24px; border: 2px solid {{cardBorder}}; background: {{cardBg}}; color: #15171A">
      <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 72px; line-height: 1">{{now}}</span>
      <span role="img" aria-label="{{diagAria}}" style="position: relative; width: 150px; height: 170px">
        <sc-for list="{{tops}}" as="t" hint-placeholder-count="6">
          <span style="position: absolute; left: {{t.x}}px; top: 0; width: 16px; margin-left: -8px; text-align: center; font-size: 14px; line-height: 14px; color: #5B6068">{{t.label}}</span>
        </sc-for>
        <span style="position: absolute; left: 0; top: 22px; width: 151px; height: 5px; background: #15171A"></span>
        <sc-for list="{{frets}}" as="f" hint-placeholder-count="4">
          <span style="position: absolute; left: 0; top: {{f.y}}px; width: 151px; height: 1px; background: #C4C7C1"></span>
        </sc-for>
        <sc-for list="{{strs}}" as="s" hint-placeholder-count="6">
          <span style="position: absolute; left: {{s.x}}px; top: 22px; width: 1px; height: 144px; background: #8A8F96"></span>
        </sc-for>
        <sc-for list="{{dots}}" as="d" hint-placeholder-count="3">
          <span style="position: absolute; left: {{d.x}}px; top: {{d.y}}px; width: 24px; height: 24px; margin-left: -11.5px; margin-top: -12px; border-radius: 50%; background: #2F5BFF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{d.f}}</span>
        </sc-for>
      </span>
      <span style="height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 10px; background: {{stBg}}; color: {{stFg}}; font-size: 14px; font-weight: 600">{{status}}</span>
    </button>

    <div style="width: 358px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; align-items: center; padding: 12px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DADCD6">
        <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 30px">{{count}}</span>
        <span style="font-size: 13px; color: #5B6068">toʻgʻri almashtirish</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; padding: 12px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DADCD6">
        <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 30px">{{loops}}</span>
        <span style="font-size: 13px; color: #5B6068">toʻliq zanjir · rekord 18</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { idx: 1, count: 13, flash: false }; }
  renderVals() {
    const chain = ['Am', 'C', 'G', 'F'];
    const SH = {
      Am: { s: ['x', 0, 2, 2, 1, 0], f: [null, null, '2', '3', '1', null] },
      C: { s: ['x', 3, 2, 0, 1, 0], f: [null, '3', '2', null, '1', null] },
      G: { s: [3, 2, 0, 0, 0, 3], f: ['2', '1', null, null, null, '3'] },
      F: { s: [1, 3, 3, 2, 1, 1], f: ['1', '3', '4', '2', '1', '1'] }
    };
    const idx = this.state.idx;
    const now = chain[idx];
    const sh = SH[now];
    const sp = 30, fr = 36, top = 22;
    const flash = this.state.flash;
    return {
      chain: chain.map((n, i) => ({ n, arrow: i < chain.length - 1, bg: i === idx ? '#2F5BFF' : '#FFFFFF', fg: i === idx ? '#FFFFFF' : (i < idx ? '#8A8F96' : '#15171A'), border: i === idx ? '#2F5BFF' : '#DADCD6' })),
      now,
      diagAria: now + ' akkordi diagrammasi',
      tops: sh.s.map((v, i) => ({ x: i * sp, label: v === 'x' ? '×' : (v === 0 ? '○' : '') })),
      frets: [1, 2, 3, 4].map((k) => ({ y: top + k * fr })),
      strs: [0, 1, 2, 3, 4, 5].map((i) => ({ x: i * sp })),
      dots: sh.s.map((v, i) => ({ v, i })).filter((p) => typeof p.v === 'number' && p.v > 0).map((p) => ({ x: p.i * sp, y: top + (p.v - 0.5) * fr, f: sh.f[p.i] || '' })),
      cardBg: flash ? '#EAF7F0' : '#FFFFFF',
      cardBorder: flash ? '#12805C' : '#DADCD6',
      status: flash ? '✓ Toʻgʻri — keyingisi' : 'Eshityapman… chaling',
      stBg: flash ? '#DDF0E7' : '#E3E9FF',
      stFg: flash ? '#0B5A40' : '#1F3FCC',
      count: this.state.count,
      loops: Math.floor(this.state.count / chain.length),
      correct: () => this.setState({ idx: (idx + 1) % chain.length, count: this.state.count + 1, flash: !flash })
    };
  }
}
</script>
</body>
</html>
