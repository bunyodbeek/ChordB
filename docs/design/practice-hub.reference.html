<style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F2; color: #15171A; font-family: 'Bricolage Grotesque', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 80px; box-sizing: border-box; padding: 0 16px; background: #FFFFFF; border-bottom: 1px solid #E3E5E0">

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px">

      <span style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #D6E0FF">Bugungi mashq · 5 daq</span>
        <span style="font-size: 12px; font-weight: 600; color: #D6E0FF">1/3</span>

      <span style="display: flex; flex-direction: column; gap: 4px">

    </a>

    <h2 style="margin: 6px 0 0; font-weight: 700; font-size: 16px">Oʻyinlar</h2>
    <sc-for list="{{games}}" as="g" hint-placeholder-count="4">
      <a href="{{g.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 10px 12px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DADCD6; color: #15171A; text-decoration: none; opacity: {{g.opacity}}">

        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-weight: 700; font-size: 16px">{{g.title}}</span>
          <span style="font-size: 13px; color: #5B6068">{{g.sub}}</span>
        </span>
        <span style="flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: {{g.metaFg}}">{{g.meta}}</span>

      </span>
      <span style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{coll}}" as="c" hint-placeholder-count="8">
          <span style="height: 28px; border-radius: 7px; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 11px">{{c.n}}</span>
        </sc-for>
      </span>
    </a>
  </div>

  <nav aria-label="Asosiy menyu" style="flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; height: 80px; box-sizing: border-box; padding: 8px 8px 12px; border-top: 1px solid #E3E5E0; background: #FFFFFF">
    <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 14px; border: 0; background: none; color: #5B6068; font-weight: 600; font-size: 11px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16a8 8 0 0 1 16 0"/><path d="M12 16l4-5"/></svg>Sozlash</button>
    <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 14px; border: 0; background: none; color: #5B6068; font-weight: 600; font-size: 11px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9.5 4v16M14.5 4v16M5 9h14M5 14h14"/></svg>Akkordlar</button>
    <button type="button" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 14px; border: 0; background: #E3E9FF; color: #1F3FCC; font-weight: 700; font-size: 11px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.5" fill="currentColor"/></svg>Mashq</button>
    <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 14px; border: 0; background: none; color: #5B6068; font-weight: 600; font-size: 11px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/></svg>Qoʻshiqlar</button>
    <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 14px; border: 0; background: none; color: #5B6068; font-weight: 600; font-size: 11px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.5 4-5 7-5s5.8 1.5 7 5"/></svg>Profil</button>
  </nav>
</div>
</x-dc>

    const have = { Am: 1, C: 1, G: 1, Em: 1, D: 1, E: 1, A: 1 };
    const all = ['Am', 'C', 'G', 'Em', 'D', 'E', 'A', 'F', 'Dm', 'B7', 'Bm', 'F#m'];
    return {
      games: [
        { href: 'G2-Almashtirish.dc.html', icon: '1:00', iconBg: '#E3E9FF', iconFg: '#1F3FCC', title: 'Akkord almashtirish', sub: '1 daqiqada nechta zanjir?', meta: 'Rekord 18', metaFg: '#15171A', opacity: 1 },
        { href: 'G3-Quloq.dc.html', icon: '♪', iconBg: '#DDF0E7', iconFg: '#0B5A40', title: 'Quloq testi', sub: 'Akkordni eshiting va toping', meta: '8/10', metaFg: '#15171A', opacity: 1 },
