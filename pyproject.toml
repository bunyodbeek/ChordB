[tool.uv.workspace]
members = ["common", "backend", "bot"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["common/tests", "backend/tests", "bot/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
# Imports go stdlib / third party / chordb_common / the package itself (app, chordb_bot).
known-first-party = ["chordb_common"]
known-local-folder = ["app", "chordb_bot", "tests"]
