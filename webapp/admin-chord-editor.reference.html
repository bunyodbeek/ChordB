<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>ChordB — Admin: akkord belgilash</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F4F5F2}
a{color:#2F5BFF}a:hover{color:#1F3FCC}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F2; color: #15171A; font-family: 'Bricolage Grotesque', sans-serif; display: flex; flex-direction: column">
  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 0">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8A4B00">Admin</span>
        <h1 style="margin: 0; font-weight: 800; font-size: 22px; letter-spacing: -0.02em">[Qoʻshiq nomi]</h1>
      </div>
      <button type="button" onClick="{{cycleSpeed}}" style="height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #DADCD6; background: #FFFFFF; color: #15171A; font-size: 13px; font-weight: 600">Tezlik {{speed}}</button>
    </div>

    <div style="position: relative; width: 358px; height: 201px; flex: none; border-radius: 16px; background: #1D2026; display: flex; align-items: center; justify-content: center">
      <span aria-hidden="true" style="position: absolute; left: 12px; top: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8A8F96">YouTube video</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 28px; color: #FFFFFF">{{clock}}</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 600">Akkord almashganda bosing</span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{palette}}" as="p" hint-placeholder-count="8">
          <button type="button" onClick="{{p.tap}}" style="height: 56px; border-radius: 14px; border: 1px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 18px">{{p.c}}</button>
        </sc-for>
      </div>
    </div>

    <section aria-label="Belgilangan akkordlar" style="flex: 1; min-height: 0; display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; border: 1px solid #DADCD6; overflow: hidden">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid #EEEFEB">
        <span style="font-size: 14px; font-weight: 600">Vaqt chizigʻi · {{count}} ta</span>
        <button type="button" onClick="{{undo}}" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #DADCD6; background: #FFFFFF; color: #15171A; font-size: 13px; font-weight: 600">Bekor qilish</button>
      </div>
      <div style="display: flex; flex-direction: column; overflow: hidden">
        <sc-for list="{{events}}" as="e" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-bottom: 1px solid #F1F2EF">
            <span style="width: 52px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #5B6068">{{e.t}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px">{{e.c}}</span>
          </div>
        </sc-for>
      </div>
    </section>
  </div>

  <div style="display: flex; gap: 8px; padding: 12px 16px 18px">
    <button type="button" aria-label="{{playAria}}" onClick="{{togglePlay}}" style="width: 56px; height: 56px; flex: none; border-radius: 16px; border: 0; background: #15171A; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center">
      <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </sc-if>
      <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </sc-if>
    </button>
    <button type="button" style="flex: 1; height: 56px; border-radius: 16px; border: 0; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 600">Saqlash va nashr qilish</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BFF","options":["#2F5BFF","#12805C","#15171A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      t: 13.4, playing: true, speed: 0.75,
      events: [{ t: 0.0, c: 'Am' }, { t: 3.2, c: 'F' }, { t: 6.5, c: 'C' }, { t: 9.8, c: 'G' }, { t: 13.1, c: 'Am' }]
    };
  }
  renderVals() {
    const accent = this.props.accent ?? '#2F5BFF';
    const fmt = (s) => Math.floor(s / 60) + ':' + (s % 60).toFixed(1).padStart(4, '0');
    const ev = this.state.events;
    const last = ev.length ? ev[ev.length - 1].c : '';
    const speeds = [1, 0.75, 0.5];
    return {
      accent,
      clock: fmt(this.state.t),
      speed: this.state.speed + '×',
      cycleSpeed: () => this.setState({ speed: speeds[(speeds.indexOf(this.state.speed) + 1) % speeds.length] }),
      palette: ['Am', 'F', 'C', 'G', 'Em', 'Dm', 'E', '+'].map((c) => ({
        c,
        bg: c === last ? accent : '#FFFFFF',
        fg: c === last ? '#FFFFFF' : '#15171A',
        border: c === last ? accent : '#DADCD6',
        tap: () => {
          if (c === '+') return;
          const nt = Math.round((this.state.t + 3.3) * 10) / 10;
          this.setState({ t: nt, events: this.state.events.concat([{ t: nt, c }]) });
        }
      })),
      count: ev.length,
      events: ev.slice(-5).reverse().map((e) => ({ t: fmt(e.t), c: e.c })),
      undo: () => this.setState({ events: ev.slice(0, -1) }),
      playing: this.state.playing,
      paused: !this.state.playing,
      playAria: this.state.playing ? 'Pauza' : 'Ijro etish',
      togglePlay: () => this.setState({ playing: !this.state.playing })
    };
  }
}
</script>
</body>
</html>
